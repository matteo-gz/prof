<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prof - Files</title>
    <link href="/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 600; letter-spacing: 0.5px; }
        .file-item:hover { background-color: #f1f3f5; }
        .file-icon { display: inline-block; width: 1.5em; text-align: center; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-white border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Prof</a>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="/history">Files</a></li>
            <li class="nav-item"><a class="nav-link" href="/person/curl">History</a></li>
        </ul>
    </div>
</nav>

<div class="container py-2">
    {{$dir := .dir}}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-white px-3 py-2 rounded border" id="bc">
            <li class="breadcrumb-item"><a href="/history">storage</a></li>
        </ol>
    </nav>

    {{if .list}}
    <div class="card mb-3">
        <div class="card-header py-2 small text-muted">Directories</div>
        <ul class="list-group list-group-flush">
            {{range $_ := .list}}
            <li class="list-group-item file-item py-2">
                <span class="file-icon">&#128193;</span>
                <a href="/history?dir={{$dir}}/{{.}}">{{.}}</a>
            </li>
            {{end}}
        </ul>
    </div>
    {{end}}

    {{if .files}}
    <div class="card">
        <div class="card-header py-2 small text-muted">Files</div>
        <ul class="list-group list-group-flush" id="fileList">
            {{range $_ := .files}}
            <li class="list-group-item file-item py-2 d-flex align-items-center" data-size="{{.Size}}">
                <span class="file-icon">&#128196;</span>
                <a target="_blank" href="/file?dir={{$dir}}/{{.Name}}">{{.Name}}</a>
                <span class="text-muted small ms-auto file-size"></span>
            </li>
            {{end}}
        </ul>
    </div>
    {{end}}
</div>

<script>
    function formatSize(bytes) {
        if (!bytes || bytes <= 0) return "";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function fileBadge(name) {
        var sp = document.createElement("span");
        sp.className = "badge me-1";
        var base = name.replace(/\.[^.]+$/, "");
        if (name.endsWith(".trace")) {
            sp.className += " bg-info text-dark";
            sp.textContent = "Trace";
        } else if (name.endsWith(".pprof")) {
            if (base === "profile") {
                sp.className += " bg-danger";
                sp.textContent = "CPU Profile";
            } else if (base === "goroutine") {
                sp.className += " bg-warning text-dark";
                sp.textContent = "Goroutine";
            } else if (base === "heap") {
                sp.className += " bg-success";
                sp.textContent = "Heap";
            } else if (base === "allocs") {
                sp.className += " bg-success";
                sp.textContent = "Allocs";
            } else if (base === "block") {
                sp.className += " bg-secondary";
                sp.textContent = "Block";
            } else if (base === "mutex") {
                sp.className += " bg-secondary";
                sp.textContent = "Mutex";
            } else if (base === "threadcreate") {
                sp.className += " bg-secondary";
                sp.textContent = "Thread";
            } else {
                sp.className += " bg-primary";
                sp.textContent = "pprof";
            }
        } else if (name.endsWith(".txt")) {
            sp.className += " bg-light text-dark border";
            sp.textContent = "Meta";
        } else {
            return null;
        }
        return sp;
    }

    (function () {
        var dir = "{{$dir}}";
        if (!dir) return;
        var parts = dir.replace(/^\/+/, "").split("/");
        var bc = document.getElementById("bc");
        var path = "";
        for (var i = 0; i < parts.length; i++) {
            if (!parts[i]) continue;
            path += "/" + parts[i];
            var li = document.createElement("li");
            li.className = "breadcrumb-item";
            if (i === parts.length - 1) {
                li.className += " active";
                li.textContent = parts[i];
            } else {
                var a = document.createElement("a");
                a.href = "/history?dir=" + path;
                a.textContent = parts[i];
                li.appendChild(a);
            }
            bc.appendChild(li);
        }

        var fl = document.getElementById("fileList");
        if (!fl) return;
        var items = fl.querySelectorAll("li");
        for (var j = 0; j < items.length; j++) {
            var link = items[j].querySelector("a");
            if (!link) continue;
            var name = link.textContent;
            var badge = fileBadge(name);
            if (badge) items[j].insertBefore(badge, link);

            var sizeEl = items[j].querySelector(".file-size");
            if (sizeEl) {
                var bytes = parseInt(items[j].getAttribute("data-size"), 10);
                var sz = formatSize(bytes);
                if (sz) sizeEl.textContent = sz;
            }
        }
    })();
</script>
</body>
</html>
