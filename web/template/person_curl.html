<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>prof</title>
    <link href="/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <ul class="nav">
        <li class="nav-item">
            <a class="nav-link" href="/">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link disabled">person</a>
        </li>
    </ul>
    <div class="row">
        <div class="col">
            <button class="btn btn-primary" type="button" id="clear">clear all</button>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <div id="result3"></div>
        </div>
    </div>
</div>

<script>
    var STORAGE_KEY = "prof:history";
    var resultEl = document.querySelector("#result3");

    function deleteStore(index) {
        if (confirm("wanna delete?")) {
            localStorage.removeItem("prof:" + index);
            var ids = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            ids = ids.filter(function (id) { return id !== index; });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
            loadStore();
        }
    }

    function loadStore() {
        var res = localStorage.getItem(STORAGE_KEY);
        var a = [];
        if (res !== null) {
            try { a = JSON.parse(res); } catch(e) { a = []; }
        }
        a = a.slice().reverse();

        resultEl.textContent = "";
        var container = document.createElement("div");
        var ol = document.createElement("ol");

        for (var i = 0; i < a.length; i++) {
            var raw = localStorage.getItem("prof:" + a[i]);
            if (raw === null) { continue; }
            var obj;
            try { obj = JSON.parse(raw); } catch(e) { continue; }

            var li = document.createElement("li");
            var span = document.createElement("span");

            var btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "delete->" + obj.index;
            (function (idx) {
                btn.addEventListener("click", function () { deleteStore(idx); });
            })(obj.index);
            span.appendChild(btn);

            var timeDiv = document.createElement("div");
            timeDiv.textContent = obj.now;
            span.appendChild(timeDiv);

            var actDiv = document.createElement("div");
            actDiv.textContent = "act: " + obj.act;
            span.appendChild(actDiv);

            var nameDiv = document.createElement("div");
            nameDiv.textContent = "name: " + obj.name;
            span.appendChild(nameDiv);

            var paths = obj.paths || [];
            if (paths.length > 0) {
                var pathOl = document.createElement("ol");
                for (var j = 0; j < paths.length; j++) {
                    var pathLi = document.createElement("li");
                    var link = document.createElement("a");
                    link.target = "_blank";
                    link.href = "/file?dir=/" + encodeURIComponent(paths[j]);
                    link.textContent = paths[j];
                    pathLi.appendChild(link);
                    pathOl.appendChild(pathLi);
                }
                span.appendChild(pathOl);
            } else if (obj.data) {
                var legacyDiv = document.createElement("div");
                legacyDiv.textContent = "(legacy entry)";
                span.appendChild(legacyDiv);
            }

            li.appendChild(span);
            ol.appendChild(li);
        }
        container.appendChild(ol);
        resultEl.appendChild(container);
    }

    function clearAll() {
        if (confirm("wanna delete?")) {
            var ids = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            for (var i = 0; i < ids.length; i++) {
                localStorage.removeItem("prof:" + ids[i]);
            }
            localStorage.removeItem(STORAGE_KEY);
            loadStore();
        }
    }

    loadStore();
    document.querySelector("#clear").addEventListener("click", clearAll);
</script>
</body>
</html>
